<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leisenhof Live Daten</title>
  <style>
    :root {
      --bg: #f3f7fb;
      --ink: #0f172a;
      --muted: #475569;
      --card: #ffffff;
      --line: #dbe5f1;
      --ok: #0f766e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #eef4fb, #f8fafc);
      color: var(--ink);
      padding: 1rem;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 2vw, 1.9rem);
    }

    .status {
      margin-top: 0.35rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .status strong {
      color: var(--ok);
    }

    .grid {
      margin-top: 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 0.8rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.8rem;
      box-shadow: 0 5px 16px rgba(15, 23, 42, 0.06);
    }

    .k {
      font-size: 0.76rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.35rem;
    }

    .v {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .row {
      margin-top: 1rem;
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.35rem 0.65rem;
      background: #fff;
      color: #1e293b;
      font-size: 0.9rem;
    }

    a {
      color: #1d4ed8;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
  <main class="wrap">
    <h1>Leisenhof Live Monitoring (LH)</h1>
    <div class="status">
      MQTT: <strong id="connState">verbinde...</strong> | Letztes Paket: <span id="lastSeen">-</span>
    </div>

    <section class="row">
      <span class="pill">ident: <span id="identValue">-</span></span>
      <span class="pill">topic: <span id="topicValue">-</span></span>
      <span class="pill">ts: <span id="tsValue">-</span></span>
      <a href="index.html">Zur historischen Visualisierung</a>
    </section>

    <section class="grid">
      <article class="card"><div class="k">P_Heat</div><div class="v" id="P_Heat">-</div></article>
      <article class="card"><div class="k">P_Pool</div><div class="v" id="P_Pool">-</div></article>
      <article class="card"><div class="k">P_WP_cool</div><div class="v" id="P_WP_cool">-</div></article>
      <article class="card"><div class="k">P_WP_el</div><div class="v" id="P_WP_el">-</div></article>
      <article class="card"><div class="k">P_WP_heat</div><div class="v" id="P_WP_heat">-</div></article>
      <article class="card"><div class="k">P_R1</div><div class="v" id="P_R1">-</div></article>
      <article class="card"><div class="k">P_R2</div><div class="v" id="P_R2">-</div></article>
      <article class="card"><div class="k">COP</div><div class="v" id="COP">-</div></article>
      <article class="card"><div class="k">EER</div><div class="v" id="EER">-</div></article>
      <article class="card"><div class="k">T_2000l_top</div><div class="v" id="T_2000l_top">-</div></article>
      <article class="card"><div class="k">T_VL_pool</div><div class="v" id="T_VL_pool">-</div></article>
      <article class="card"><div class="k">T_VL_heating</div><div class="v" id="T_VL_heating">-</div></article>
      <article class="card"><div class="k">T_max_BIO</div><div class="v" id="T_max_BIO">-</div></article>
      <article class="card"><div class="k">T_max_BIO_R2</div><div class="v" id="T_max_BIO_R2">-</div></article>
    </section>
  </main>

  <script src="live_leisenhof_reactor1.js"></script>
</body>
</html>
