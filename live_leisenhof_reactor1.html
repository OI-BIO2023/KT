<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leisenhof Live Monitoring</title>
  <style>
    :root {
      --ink: #e6eefc;
      --muted: #aab9d7;
      --line: #eef4ff;
      --hotel: #d4af37;
      --air: #1e3a8a;
      --pool: #3b82f6;
      --card: rgba(10, 15, 28, 0.56);
      --border: rgba(255, 255, 255, 0.18);
      --temp-border: #d62828;
      --temp-text: #ff9f1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(circle at 10% 5%, #1f2937 0%, #0b1220 55%);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
      padding: 0.9rem;
    }

    .shell { max-width: 1240px; margin: 0 auto; }

    .head {
      margin-bottom: 0.7rem;
      display: flex;
      justify-content: space-between;
      gap: 0.8rem;
      flex-wrap: wrap;
      align-items: baseline;
    }

    h1 { margin: 0; font-size: clamp(1.15rem, 2.2vw, 1.7rem); letter-spacing: 0.02em; }

    .meta {
      color: var(--muted);
      font-size: 0.78rem;
      display: flex;
      gap: 0.7rem;
      flex-wrap: wrap;
    }

    .meta strong { color: #f8fbff; font-weight: 400; }

    .link-row { margin-bottom: 0.8rem; font-size: 0.9rem; }
    .link-row a { color: #7cc3ff; text-decoration: none; font-weight: 400; }

    .scene {
      position: relative;
      width: min(100%, 1180px);
      margin: 0 auto;
      aspect-ratio: 1536 / 1000;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .scene img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.05) contrast(1.02);
    }

    .flow { position: absolute; inset: 0; pointer-events: none; }

    .guide-path {
      fill: none;
      stroke: transparent;
      stroke-width: 0;
    }

    .arrow-glyph {
      fill: none;
      stroke: var(--line);
      stroke-width: 0.9;
      stroke-linecap: round;
      opacity: 0.72;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.35));
    }

    .box {
      position: absolute;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 5px solid #ffffff;
      border-radius: 10px;
      padding: 0.35rem 0.48rem;
      backdrop-filter: blur(2px);
      box-shadow: 0 7px 16px rgba(0, 0, 0, 0.3);
      font-size: clamp(10px, 0.76vw, 13px);
      font-weight: 400;
    }

    .line {
      display: flex;
      justify-content: space-between;
      gap: 0.45rem;
      white-space: nowrap;
      font-weight: 400;
    }

    .name { color: #cfddf7; margin-right: 0.35rem; font-weight: 400; }
    .val { color: #f4f8ff; font-weight: 400; }

    .pair {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.56rem;
    }

    .pair .box { position: relative; }

    .hotel-pair { left: 9.6%; top: 14.9%; }
    .r1-pair { left: 50.8%; top: 47.0%; }
    .r2-pair { left: 71.9%; top: 47.4%; }
    .pool-pair { left: 2.3%; top: 56.2%; }

    .hotel { border-left-color: var(--hotel); min-width: 128px; }
    .r1 { border-left-color: #a855f7; min-width: 134px; }
    .r2 { border-left-color: #6d28d9; min-width: 134px; }
    .pool { border-left-color: var(--pool); min-width: 108px; max-width: 128px; }

    .temp {
      border: 1px solid var(--temp-border);
      border-left: 5px solid var(--temp-border);
      background: var(--card);
      min-width: 90px;
      max-width: 122px;
    }

    .temp .name,
    .temp .val {
      color: var(--temp-text);
      font-weight: 400;
    }

    .wp {
      left: 27%;
      top: 44.5%;
      border-left-color: #7f1d1d;
      min-width: 145px;
      max-width: 170px;
    }

    .wp .title {
      margin: 0 0 0.18rem;
      font-size: 0.92em;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .air {
      left: 84%;
      top: 77%;
      border-left-color: var(--air);
      min-width: 92px;
      max-width: 126px;
    }

    @media (max-width: 860px) {
      .scene { aspect-ratio: 3 / 4; }
      .scene img { object-position: 58% center; }

      .box {
        padding: 0.32rem 0.4rem;
        font-size: clamp(10px, 2.4vw, 12px);
      }

      .hotel-pair { left: 6%; top: 8.6%; }
      .r1-pair { left: 58.9%; top: 40%; }
      .r2-pair { left: 59.9%; top: 54%; }
      .pool-pair { left: 4%; top: 61%; }

      .wp { left: 18%; top: 36.5%; max-width: 35vw; min-width: 118px; }
      .air { left: 66%; top: 78%; min-width: 84px; }

      .arrow-glyph { stroke-width: 1.05; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="head">
      <h1>Leisenhof Live Monitoring</h1>
      <div class="meta">
        <span>Status: <strong id="connState">warte auf API...</strong></span>
        <span>Letztes Update: <strong id="lastSeen">-</strong></span>
      </div>
    </header>

    <div class="link-row"><a href="index.html">Zur historischen Visualisierung</a></div>

    <section class="scene">
      <img src="Reactors_4.png" alt="Leisenhof Anlage" />

      <svg class="flow" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <path id="path_air_wp" class="guide-path" d="M84,78 C73,73 56,61 33,47"></path>
          <path id="path_r1_wp" class="guide-path" d="M56,55 C49,53 41,50 33,47"></path>
          <path id="path_r2_wp" class="guide-path" d="M76,56 C61,53 46,50 33,47"></path>
          <path id="path_wp_hotel" class="guide-path" d="M33,47 C25,38 20,30 14,22"></path>
          <path id="path_wp_pool" class="guide-path" d="M33,47 C24,53 16,58 8,61"></path>
        </defs>

        <g class="arrow-glyph">
          <path d="M0,0 L1.9,-1.2"></path><path d="M0,0 L1.9,1.2"></path>
          <animateMotion dur="3.8s" repeatCount="indefinite" rotate="auto"><mpath href="#path_air_wp"></mpath></animateMotion>
        </g>
        <g class="arrow-glyph">
          <path d="M0,0 L1.9,-1.2"></path><path d="M0,0 L1.9,1.2"></path>
          <animateMotion dur="3.8s" begin="-1.1s" repeatCount="indefinite" rotate="auto"><mpath href="#path_air_wp"></mpath></animateMotion>
        </g>
        <g class="arrow-glyph">
          <path d="M0,0 L1.8,-1.1"></path><path d="M0,0 L1.8,1.1"></path>
          <animateMotion dur="2.6s" repeatCount="indefinite" rotate="auto"><mpath href="#path_r1_wp"></mpath></animateMotion>
        </g>
        <g class="arrow-glyph">
          <path d="M0,0 L1.8,-1.1"></path><path d="M0,0 L1.8,1.1"></path>
          <animateMotion dur="2.8s" repeatCount="indefinite" rotate="auto"><mpath href="#path_r2_wp"></mpath></animateMotion>
        </g>
        <g class="arrow-glyph">
          <path d="M0,0 L1.8,-1.1"></path><path d="M0,0 L1.8,1.1"></path>
          <animateMotion dur="3.0s" repeatCount="indefinite" rotate="auto"><mpath href="#path_wp_hotel"></mpath></animateMotion>
        </g>
        <g class="arrow-glyph">
          <path d="M0,0 L1.8,-1.1"></path><path d="M0,0 L1.8,1.1"></path>
          <animateMotion dur="3.2s" begin="-1.4s" repeatCount="indefinite" rotate="auto"><mpath href="#path_wp_pool"></mpath></animateMotion>
        </g>
      </svg>

      <article class="box wp">
        <div class="title">Waermepumpen</div>
        <div class="line"><span class="name">Strom</span><span class="val" id="technikPWpEl">-</span></div>
        <div class="line"><span class="name">Waerme</span><span class="val" id="technikPWpHeat">-</span></div>
      </article>

      <article class="box air">
        <div class="line"><span class="name">Luft</span><span class="val" id="airPower">-</span></div>
      </article>

      <section class="pair hotel-pair">
        <article class="box temp"><div class="line"><span class="name">&#127777;</span><span class="val" id="hotelTVlHeat">-</span></div></article>
        <article class="box hotel"><div class="line"><span class="name">Hotel</span><span class="val" id="hotelPHeat">-</span></div></article>
      </section>

      <section class="pair r1-pair">
        <article class="box temp"><div class="line"><span class="name">&#127777;</span><span class="val" id="r1Temp">-</span></div></article>
        <article class="box r1"><div class="line"><span class="name">Reaktor 1</span><span class="val" id="r1Power">-</span></div></article>
      </section>

      <section class="pair r2-pair">
        <article class="box temp"><div class="line"><span class="name">&#127777;</span><span class="val" id="r2Temp">-</span></div></article>
        <article class="box r2"><div class="line"><span class="name">Reaktor 2</span><span class="val" id="r2Power">-</span></div></article>
      </section>

      <section class="pair pool-pair">
        <article class="box temp"><div class="line"><span class="name">&#127777;</span><span class="val" id="poolTemp">-</span></div></article>
        <article class="box pool"><div class="line"><span class="name">Pool</span><span class="val" id="poolPower">-</span></div></article>
      </section>
    </section>
  </main>

  <script src="live_leisenhof_reactor1.js"></script>
</body>
</html>
