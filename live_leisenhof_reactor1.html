<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leisenhof Live Monitoring</title>
  <style>
    :root {
      --ink: #e6eefc;
      --muted: #aab9d7;
      --line: #eef4ff;
      --hotel: #d4af37;
      --air: #1e3a8a;
      --pool: #3b82f6;
      --card: rgba(10, 15, 28, 0.56);
      --border: rgba(255, 255, 255, 0.18);
      --temp-border: #d62828;
      --temp-text: #ff9f1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(circle at 10% 5%, #1f2937 0%, #0b1220 55%);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
      padding: 0.9rem;
    }

    .shell { max-width: 1240px; margin: 0 auto; }

    .head {
      margin-bottom: 0.7rem;
      display: flex;
      justify-content: space-between;
      gap: 0.8rem;
      flex-wrap: wrap;
      align-items: baseline;
    }

    h1 { margin: 0; font-size: clamp(1.15rem, 2.2vw, 1.7rem); letter-spacing: 0.02em; }

    .meta {
      color: var(--muted);
      font-size: 0.78rem;
      display: flex;
      gap: 0.7rem;
      flex-wrap: wrap;
    }

    .meta strong { color: #f8fbff; font-weight: 400; }

    .link-row { margin-bottom: 0.8rem; font-size: 0.9rem; }
    .link-row a { color: #7cc3ff; text-decoration: none; font-weight: 400; }

    .scene {
      position: relative;
      width: min(100%, 1180px);
      margin: 0 auto;
      aspect-ratio: 1536 / 1000;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .scene img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.05) contrast(1.02);
    }

    .flow { position: absolute; inset: 0; pointer-events: none; }

    .guide-path {
      fill: none;
      stroke: transparent;
      stroke-width: 0;
    }

    .arrow-glyph {
      fill: none;
      stroke: var(--line);
      stroke-width: 0.9;
      stroke-linecap: round;
      opacity: 0.72;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.35));
    }

    .debug-path {
      fill: none;
      stroke-width: 0.28;
      opacity: 0.62;
      stroke-dasharray: 0.8 0.6;
    }

    .grid-line {
      stroke: #d1d5db;
      stroke-width: 0.08;
      opacity: 0.42;
    }

    .grid-label {
      fill: #e5e7eb;
      font-size: 0.95px;
      font-family: "Segoe UI", Arial, sans-serif;
      opacity: 0.65;
    }

    .p-air { stroke: #1e3a8a; }
    .p-r1 { stroke: #a855f7; }
    .p-r2 { stroke: #6d28d9; }
    .p-hotel { stroke: #d4af37; }
    .p-pool { stroke: #3b82f6; }

    .debug-point {
      r: 0.38;
      fill: #f8fafc;
      stroke: #0f172a;
      stroke-width: 0.1;
      opacity: 0.95;
    }

    .debug-label {
      font-size: 1.05px;
      font-family: "Segoe UI", Arial, sans-serif;
      paint-order: stroke;
      stroke: rgba(0, 0, 0, 0.75);
      stroke-width: 0.2;
      opacity: 0.95;
    }

    .debug-label.p-air { fill: #1e3a8a; }
    .debug-label.p-r1 { fill: #a855f7; }
    .debug-label.p-r2 { fill: #6d28d9; }
    .debug-label.p-hotel { fill: #d4af37; }
    .debug-label.p-pool { fill: #3b82f6; }

    .box {
      position: absolute;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 5px solid #ffffff;
      border-radius: 10px;
      padding: 0.35rem 0.48rem;
      backdrop-filter: blur(2px);
      box-shadow: 0 7px 16px rgba(0, 0, 0, 0.3);
      font-size: clamp(15px, 1.14vw, 19px);
      font-weight: 400;
    }

    .line {
      display: flex;
      justify-content: space-between;
      gap: 0.45rem;
      white-space: nowrap;
      font-weight: 400;
    }

    .name { color: #cfddf7; margin-right: 0.35rem; font-weight: 400; }
    .val { color: #f4f8ff; font-weight: 400; }

    .pair {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.56rem;
    }

    .pair .box { position: relative; }

    .hotel-pair { left: 9.6%; top: 14.9%; }
    .r1-pair { left: 50.8%; top: 47.0%; }
    .r2-pair { left: 71.9%; top: 47.4%; }
    .pool-pair { left: 2.3%; top: 56.2%; }

    .hotel { border-left-color: var(--hotel); min-width: 128px; }
    .r1 { border-left-color: #a855f7; min-width: 134px; }
    .r2 { border-left-color: #6d28d9; min-width: 134px; }
    .pool { border-left-color: var(--pool); min-width: 108px; max-width: 128px; }

    .temp {
      border: 1px solid var(--temp-border);
      border-left: 5px solid var(--temp-border);
      background: var(--card);
      min-width: 90px;
      max-width: 122px;
    }

    .temp .name,
    .temp .val {
      color: var(--temp-text);
      font-weight: 400;
    }

    .wp {
      left: 27%;
      top: 44.5%;
      border-left-color: #7f1d1d;
      min-width: 145px;
      max-width: 170px;
    }

    .wp .title {
      margin: 0 0 0.18rem;
      font-size: 1.05em;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .air {
      left: 84%;
      top: 77%;
      border-left-color: var(--air);
      min-width: 92px;
      max-width: 126px;
    }
  </style>
</head>
<body>

      <div class="meta">
        <span>Status: <strong id="connState">warte auf API...</strong></span>
        <span>Letztes Update: <strong id="lastSeen">-</strong></span>
      </div>
    </header>

    <div class="link-row"><a href="index.html">Zur historischen Visualisierung</a></div>
