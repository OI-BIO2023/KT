<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leisenhof Live Monitoring</title>
  <style>
    :root {
      --ink: #e6eefc;
      --muted: #aab9d7;
      --hotel: #d4af37;
      --air: #1e3a8a;
      --pool: #3b82f6;
      --r1: #6b7f2a;
      --r2: #6b7f2a;
      --wp: #7f1d1d;
      --card: rgba(10, 15, 28, 0.42);
      --border: rgba(255, 255, 255, 0.2);
      --temp-border: #d62828;
      --temp-text: #ff9f1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0.9rem;
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at 10% 5%, #1f2937 0%, #0b1220 55%);
    }

    .shell {
      max-width: 1280px;
      margin: 0 auto;
    }

    .head {
      margin-bottom: 0.72rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.36rem, 2.5vw, 2rem);
      line-height: 1.55;
      letter-spacing: 0.02em;
      min-height: 3.1rem;
    }

    .head-right {
      min-height: 3.1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      gap: 0.25rem;
    }

    .meta {
      color: var(--muted);
      font-size: 0.78rem;
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      justify-content: flex-end;
      text-align: right;
      line-height: 1.2;
    }

    .meta strong { color: #f8fbff; font-weight: 400; }

    .link-row { font-size: 0.9rem; text-align: right; width: 100%; }

    .link-row a {
      color: #7cc3ff;
      text-decoration: none;
      font-weight: 400;
    }

    .scene {
      position: relative;
      width: min(100%, 1220px);
      margin: 0 auto;
      aspect-ratio: 1536 / 1000;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .scene img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.05) contrast(1.02);
    }

    .flow {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .guide-path { fill: none; stroke: transparent; stroke-width: 0; }

    .grid-line {
      stroke: #d1d5db;
      stroke-width: 0.08;
      opacity: 0.42;
    }

    .grid-label {
      fill: #e5e7eb;
      font-size: 0.95px;
      font-family: "Segoe UI", Arial, sans-serif;
      opacity: 0.65;
    }

    .debug-path {
      fill: none;
      stroke-width: 0.26;
      opacity: 0.66;
      stroke-dasharray: 0.8 0.62;
    }

    .p-air { stroke: var(--air); }
    .p-r1 { stroke: var(--r1); }
    .p-r2 { stroke: var(--r2); }
    .p-hotel { stroke: var(--hotel); }
    .p-pool { stroke: var(--pool); }

    .debug-point {
      r: 0.38;
      fill: #f8fafc;
      stroke: #0f172a;
      stroke-width: 0.1;
      opacity: 0.95;
    }

    .debug-label {
      font-size: 1px;
      font-family: "Segoe UI", Arial, sans-serif;
      paint-order: stroke;
      stroke: rgba(0, 0, 0, 0.75);
      stroke-width: 0.2;
      opacity: 0.95;
    }

    .debug-label.p-air { fill: var(--air); }
    .debug-label.p-r1 { fill: var(--r1); }
    .debug-label.p-r2 { fill: var(--r2); }
    .debug-label.p-hotel { fill: var(--hotel); }
    .debug-label.p-pool { fill: var(--pool); }

    .arrow-glyph {
      fill: none;
      stroke-width: 0.88;
      stroke-linecap: round;
      opacity: 0.76;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.32));
    }

    .box {
      position: absolute;
      min-width: 214px;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 5px solid #ffffff;
      border-radius: 10px;
      padding: 0.56rem 0.72rem;
      backdrop-filter: blur(2px);
      box-shadow: 0 7px 16px rgba(0, 0, 0, 0.3);
      font-size: clamp(18px, 1.34vw, 24px);
      font-weight: 400;
      line-height: 1.14;
    }

    .line {
      display: flex;
      justify-content: space-between;
      gap: 0.52rem;
      white-space: nowrap;
      font-weight: 400;
    }

    .name { color: #cfddf7; margin-right: 0.34rem; font-weight: 400; }
    .val { color: #f4f8ff; font-weight: 400; }

    .pair {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.56rem;
    }

    .pair .box { position: relative; }

    .hotel-pair { left: 8.7%; top: 13.7%; }
    .r1-pair { left: 49.8%; top: 45.8%; }
    .r2-pair { left: 70.9%; top: 46.1%; }
    .pool-pair { left: 1.8%; top: 55.2%; }

    .hotel { border-left-color: var(--hotel); min-width: 222px; max-width: 252px; }
    .r1 { border-left-color: var(--r1); min-width: 230px; max-width: 260px; }
    .r2 { border-left-color: var(--r2); min-width: 230px; max-width: 260px; }
    .pool { border-left-color: var(--pool); min-width: 214px; max-width: 246px; }

    .temp {
      border: 1px solid var(--temp-border);
      border-left: 5px solid var(--temp-border);
      background: var(--card);
      min-width: 136px;
      max-width: 152px;
      padding: 0.38rem 0.46rem;
    }

    .pair .temp { margin-right: -11px; }

    .temp .name,
    .temp .val {
      color: var(--temp-text);
      font-weight: 400;
    }

    .wp {
      left: 25.6%;
      top: 42.7%;
      border-left-color: var(--wp);
      min-width: 248px;
      max-width: 280px;
    }

    .wp .title {
      margin: 0 0 0.2rem;
      font-size: 1.02em;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #f4f8ff;
    }

    .air {
      left: 83.7%;
      top: 76.7%;
      border-left-color: var(--air);
      min-width: 170px;
      max-width: 198px;
    }

    @media (max-width: 980px) {
      body { padding: 0.6rem; }
      h1 {
        min-height: auto;
        line-height: 1.25;
      }
      .head-right {
        min-height: auto;
        width: 100%;
        align-items: flex-start;
      }
      .meta, .link-row {
        justify-content: flex-start;
        text-align: left;
      }
      .box {
        font-size: clamp(14px, 2.15vw, 18px);
        min-width: 150px;
      }
      .hotel, .r1, .r2, .pool, .temp, .wp, .air {
        min-width: 0;
      }
    }
  </style>
</head>
