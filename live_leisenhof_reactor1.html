<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leisenhof Live Monitoring</title>
  <style>
    :root {
      --bg: #0b1220;
      --ink: #e6eefc;
      --muted: #aab9d7;
      --line: #f0f4ff;
      --hotel: #d4af37;
      --air: #1e3a8a;
      --pool: #3b82f6;
      --thermo: #6b8e23;
      --temp-red: #ff5959;
      --card: rgba(10, 15, 28, 0.82);
      --border: rgba(255, 255, 255, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at 10% 5%, #1f2937 0%, #0b1220 55%);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
      padding: 0.9rem;
    }

    .shell {
      max-width: 1240px;
      margin: 0 auto;
    }

    .head {
      margin-bottom: 0.7rem;
      display: flex;
      justify-content: space-between;
      gap: 0.8rem;
      flex-wrap: wrap;
      align-items: baseline;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.15rem, 2.2vw, 1.7rem);
      letter-spacing: 0.02em;
    }

    .meta {
      color: var(--muted);
      font-size: 0.92rem;
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .meta strong {
      color: #f8fbff;
    }

    .link-row {
      margin-bottom: 0.8rem;
      font-size: 0.92rem;
    }

    .link-row a {
      color: #7cc3ff;
      text-decoration: none;
      font-weight: 600;
    }

    .scene {
      position: relative;
      width: min(100%, 1180px);
      margin: 0 auto;
      aspect-ratio: 1536 / 1000;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .scene img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.05) contrast(1.02);
    }

    .flow {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .flow line {
      stroke: var(--line);
      stroke-width: 0.75;
      stroke-linecap: round;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.5));
      opacity: 0.46;
    }

    .panel {
      position: absolute;
      min-width: 140px;
      max-width: min(32vw, 238px);
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 6px solid #ffffff;
      border-radius: 10px;
      padding: 0.45rem 0.55rem 0.5rem;
      backdrop-filter: blur(2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      font-size: clamp(10px, 0.78vw, 14px);
    }

    .panel .title {
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.28rem;
    }

    .panel .row {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      margin-top: 0.12rem;
      white-space: nowrap;
      color: #f4f8ff;
      font-weight: 400;
      font-size: 1.05em;
    }

    .panel .k {
      color: #cfddf7;
      margin-right: 0.45rem;
    }

    .panel.hotel { left: 10%; top: 15%; border-left-color: var(--hotel); }
    .panel.technik { left: 35%; top: 46%; border-left-color: #7f1d1d; }
    .panel.r1 { left: 51%; top: 56%; border-left-color: #a855f7; }
    .panel.r2 { left: 72%; top: 55%; border-left-color: #6d28d9; }
    .panel.air { left: 82%; top: 77%; border-left-color: var(--air); }
    .panel.pool { left: 2%; top: 54%; border-left-color: var(--pool); min-width: 124px; }

    .thermo {
      position: absolute;
      background: rgba(19, 28, 13, 0.92);
      border: 1px solid rgba(183, 213, 140, 0.8);
      border-left: 6px solid var(--thermo);
      border-radius: 10px;
      color: #f4ffe8;
      padding: 0.34rem 0.5rem;
      font-size: clamp(10px, 0.76vw, 14px);
      font-weight: 400;
      backdrop-filter: blur(2px);
    }

    .thermo .k {
      color: #dbe9cb;
      margin-right: 0.35rem;
    }

    .thermo .v {
      color: var(--temp-red);
      font-weight: 400;
    }

    .thermo .ticon {
      margin-right: 0.25rem;
      opacity: 0.95;
    }

    .thermo.r1t { left: 52%; top: 50%; }
    .thermo.r2t { left: 73%; top: 49%; }
    .thermo.hotelt { left: 18%; top: 22%; }
    .thermo.poolt {
      left: 2%;
      top: 62.5%;
      border-left-color: #ef4444;
      border-color: rgba(248, 113, 113, 0.8);
      background: rgba(50, 12, 12, 0.9);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 860px) {
      .scene {
        aspect-ratio: 3 / 4;
      }

      .scene img {
        object-position: 58% center;
      }

      .panel {
        min-width: 118px;
        max-width: 44vw;
        padding: 0.38rem 0.45rem 0.42rem;
        font-size: clamp(10px, 2.5vw, 12px);
      }

      .panel.hotel { left: 6%; top: 9%; }
      .panel.technik { left: 26%; top: 40%; }
      .panel.r1 { left: 59%; top: 50%; }
      .panel.r2 { left: 60%; top: 63%; }
      .panel.air { left: 60%; top: 78%; }
      .panel.pool { left: 4%; top: 59%; }

      .thermo.r1t { left: 63%; top: 44%; }
      .thermo.r2t { left: 64%; top: 58%; }
      .thermo.hotelt { left: 22%; top: 17%; }
      .thermo.poolt { left: 4%; top: 67%; }

      .flow line {
        stroke-width: 1.05;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="head">
      <h1>Leisenhof Live Monitoring (LH)</h1>
      <div class="meta">
        <span>Status: <strong id="connState">warte auf API...</strong></span>
        <span>Letztes Update: <strong id="lastSeen">-</strong></span>
        <span>Datensatz: <strong id="tsValue">-</strong></span>
      </div>
    </header>

    <div class="link-row">
      <a href="index.html">Zur historischen Visualisierung</a>
    </div>

    <section class="scene">
      <img src="Reactors_4.png" alt="Leisenhof Anlage" />

      <svg class="flow" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <marker id="arrowHead" markerWidth="5" markerHeight="5" refX="4.6" refY="2.5" orient="auto">
            <path d="M0,0 L5,2.5 L0,5 Z" fill="#e8eefc" />
          </marker>
        </defs>
        <line x1="86" y1="83" x2="52" y2="52" marker-end="url(#arrowHead)"></line>
        <line x1="58" y1="58" x2="52" y2="52" marker-end="url(#arrowHead)"></line>
        <line x1="78" y1="57" x2="52" y2="52" marker-end="url(#arrowHead)"></line>
        <line x1="52" y1="52" x2="22" y2="30" marker-end="url(#arrowHead)"></line>
        <line x1="52" y1="52" x2="10" y2="60" marker-end="url(#arrowHead)"></line>
      </svg>

      <article class="panel hotel">
        <div class="title">Hotel</div>
        <div class="row"><span class="k">P_HEAT</span><span id="hotelPHeat">-</span></div>
      </article>

      <article class="panel technik">
        <div class="title">Wärmepumpen</div>
        <div class="row"><span class="k">P_WP_EL</span><span id="technikPWpEl">-</span></div>
        <div id="technikHeatRow" class="row"><span class="k">P_WP_HEAT</span><span id="technikPWpHeat">-</span></div>
        <div id="technikCoolRow" class="row"><span class="k">P_WP_COOL</span><span id="technikPWpCool">-</span></div>
      </article>

      <article class="panel r1">
        <div class="title">Reaktor 1</div>
        <div class="row"><span class="k">P_R1</span><span id="r1Power">-</span></div>
      </article>

      <article class="panel r2">
        <div class="title">Reaktor 2</div>
        <div class="row"><span class="k">P_R2</span><span id="r2Power">-</span></div>
      </article>

      <article class="panel air">
        <div class="title">Luft</div>
        <div class="row"><span class="k">P_L</span><span id="airPower">-</span></div>
      </article>

      <article class="panel pool">
        <div class="title">Pool</div>
        <div class="row"><span class="k">P_POOL</span><span id="poolPower">-</span></div>
      </article>

      <article class="thermo r1t">
        <span class="ticon">&#127777;</span><span class="k">T_MAX_BIO</span><span class="v" id="r1Temp">-</span>
      </article>
      <article class="thermo r2t">
        <span class="ticon">&#127777;</span><span class="k">T_MAX_BIO_R2</span><span class="v" id="r2Temp">-</span>
      </article>
      <article class="thermo hotelt">
        <span class="ticon">&#127777;</span><span class="k">T_VL_HEATING</span><span class="v" id="hotelTVlHeat">-</span>
      </article>
      <article class="thermo poolt">
        <span class="ticon">&#127777;</span><span class="k">T_VL_POOL</span><span class="v" id="poolTemp">-</span>
      </article>
    </section>
  </main>

  <script src="live_leisenhof_reactor1.js"></script>
</body>
</html>
