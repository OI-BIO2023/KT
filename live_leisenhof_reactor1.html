<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leisenhof Live Monitoring</title>
  <style>
    :root {
      --ink: #e6eefc;
      --muted: #aab9d7;
      --line: #f0f4ff;
      --hotel: #d4af37;
      --air: #1e3a8a;
      --pool: #3b82f6;
      --card: rgba(10, 15, 28, 0.82);
      --border: rgba(255, 255, 255, 0.22);
      --temp-border: #d62828;
      --temp-text: #ff9f1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(circle at 10% 5%, #1f2937 0%, #0b1220 55%);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
      padding: 0.9rem;
    }

    .shell { max-width: 1240px; margin: 0 auto; }

    .head {
      margin-bottom: 0.7rem;
      display: flex;
      justify-content: space-between;
      gap: 0.8rem;
      flex-wrap: wrap;
      align-items: baseline;
    }

    h1 { margin: 0; font-size: clamp(1.15rem, 2.2vw, 1.7rem); letter-spacing: 0.02em; }

    .meta {
      color: var(--muted);
      font-size: 0.92rem;
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .meta strong { color: #f8fbff; font-weight: 400; }

    .link-row { margin-bottom: 0.8rem; font-size: 0.92rem; }
    .link-row a { color: #7cc3ff; text-decoration: none; font-weight: 400; }

    .scene {
      position: relative;
      width: min(100%, 1180px);
      margin: 0 auto;
      aspect-ratio: 1536 / 1000;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .scene img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.05) contrast(1.02);
    }

    .flow { position: absolute; inset: 0; pointer-events: none; }

    .flow-path {
      fill: none;
      stroke: var(--line);
      stroke-width: 0.95;
      stroke-linecap: round;
      opacity: 0.55;
      stroke-dasharray: 4 5;
      animation: flowMove 3.6s linear infinite;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.45));
    }

    @keyframes flowMove {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -36; }
    }

    .box {
      position: absolute;
      min-width: 138px;
      max-width: min(33vw, 255px);
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 6px solid #ffffff;
      border-radius: 10px;
      padding: 0.42rem 0.52rem;
      backdrop-filter: blur(2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      font-size: clamp(10px, 0.78vw, 14px);
      font-weight: 400;
    }

    .line {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      white-space: nowrap;
      font-weight: 400;
    }

    .name { color: #cfddf7; margin-right: 0.45rem; font-weight: 400; }
    .val { color: #f4f8ff; font-weight: 400; }

    .hotel { left: 10%; top: 15%; border-left-color: var(--hotel); }
    .wp { left: 35%; top: 46%; border-left-color: #7f1d1d; min-width: 170px; }
    .r1 { left: 51%; top: 56%; border-left-color: #a855f7; }
    .r2 { left: 72%; top: 55%; border-left-color: #6d28d9; }
    .air { left: 82%; top: 77%; border-left-color: var(--air); }
    .pool { left: 2%; top: 54%; border-left-color: var(--pool); min-width: 128px; }

    .temp {
      border: 1px solid var(--temp-border);
      border-left: 6px solid var(--temp-border);
      background: rgba(55, 10, 10, 0.9);
    }

    .temp .name,
    .temp .val {
      color: var(--temp-text);
      font-weight: 400;
    }

    .r1t { left: 52%; top: 50%; }
    .r2t { left: 73%; top: 49%; }
    .hotelt { left: 18%; top: 22%; }
    .poolt { left: 2%; top: 62.5%; }

    @media (max-width: 860px) {
      .scene { aspect-ratio: 3 / 4; }
      .scene img { object-position: 58% center; }

      .box {
        min-width: 118px;
        max-width: 44vw;
        padding: 0.36rem 0.42rem;
        font-size: clamp(10px, 2.5vw, 12px);
      }

      .hotel { left: 6%; top: 9%; }
      .wp { left: 24%; top: 39%; }
      .r1 { left: 59%; top: 50%; }
      .r2 { left: 60%; top: 63%; }
      .air { left: 60%; top: 78%; }
      .pool { left: 4%; top: 59%; }
      .r1t { left: 63%; top: 44%; }
      .r2t { left: 64%; top: 58%; }
      .hotelt { left: 22%; top: 17%; }
      .poolt { left: 4%; top: 67%; }

      .flow-path { stroke-width: 1.1; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="head">
      <h1>Leisenhof Live Monitoring (LH)</h1>
      <div class="meta">
        <span>Status: <strong id="connState">warte auf API...</strong></span>
        <span>Letztes Update: <strong id="lastSeen">-</strong></span>
        <span>Datensatz: <strong id="tsValue">-</strong></span>
      </div>
    </header>

    <div class="link-row"><a href="index.html">Zur historischen Visualisierung</a></div>

    <section class="scene">
      <img src="Reactors_4.png" alt="Leisenhof Anlage" />

      <svg class="flow" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <marker id="arrowHead" markerWidth="5" markerHeight="5" refX="4.6" refY="2.5" orient="auto">
            <path d="M0,0 L5,2.5 L0,5 Z" fill="#e8eefc"></path>
          </marker>
        </defs>
        <path class="flow-path" d="M86,79 Q67,63 43,49" marker-end="url(#arrowHead)"></path>
        <path class="flow-path" d="M57,59 Q50,54 43,49" marker-end="url(#arrowHead)"></path>
        <path class="flow-path" d="M78,58 Q59,53 43,49" marker-end="url(#arrowHead)"></path>
        <path class="flow-path" d="M43,49 Q30,37 18,20" marker-end="url(#arrowHead)"></path>
        <path class="flow-path" d="M43,49 Q24,54 8,57" marker-end="url(#arrowHead)"></path>
      </svg>

      <article class="box hotel">
        <div class="line"><span class="name">Hotel</span><span class="val" id="hotelPHeat">-</span></div>
      </article>

      <article class="box wp">
        <div class="line"><span class="name">Strom</span><span class="val" id="technikPWpEl">-</span></div>
        <div class="line"><span class="name">Wärme</span><span class="val" id="technikPWpHeat">-</span></div>
      </article>

      <article class="box r1">
        <div class="line"><span class="name">Reaktor 1</span><span class="val" id="r1Power">-</span></div>
      </article>

      <article class="box r2">
        <div class="line"><span class="name">Reaktor 2</span><span class="val" id="r2Power">-</span></div>
      </article>

      <article class="box air">
        <div class="line"><span class="name">Luft</span><span class="val" id="airPower">-</span></div>
      </article>

      <article class="box pool">
        <div class="line"><span class="name">Pool</span><span class="val" id="poolPower">-</span></div>
      </article>

      <article class="box temp r1t">
        <div class="line"><span class="name">&#127777;</span><span class="val" id="r1Temp">-</span></div>
      </article>
      <article class="box temp r2t">
        <div class="line"><span class="name">&#127777;</span><span class="val" id="r2Temp">-</span></div>
      </article>
      <article class="box temp hotelt">
        <div class="line"><span class="name">&#127777;</span><span class="val" id="hotelTVlHeat">-</span></div>
      </article>
      <article class="box temp poolt">
        <div class="line"><span class="name">&#127777;</span><span class="val" id="poolTemp">-</span></div>
      </article>
    </section>
  </main>

  <script src="live_leisenhof_reactor1.js"></script>
</body>
</html>
