<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leisenhof Live Monitoring</title>
  <style>
    :root {
      --bg: #0b1220;
      --ink: #e6eefc;
      --muted: #aab9d7;
      --line: #f0f4ff;
      --hotel: #ec4899;
      --technik: #f59e0b;
      --r1: #a855f7;
      --r2: #6d28d9;
      --air: #ef4444;
      --pool: #3b82f6;
      --card: rgba(10, 15, 28, 0.82);
      --border: rgba(255, 255, 255, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at 10% 5%, #1f2937 0%, #0b1220 55%);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
      padding: 0.9rem;
    }

    .shell {
      max-width: 1240px;
      margin: 0 auto;
    }

    .head {
      margin-bottom: 0.7rem;
      display: flex;
      justify-content: space-between;
      gap: 0.8rem;
      flex-wrap: wrap;
      align-items: baseline;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.15rem, 2.2vw, 1.7rem);
      letter-spacing: 0.02em;
    }

    .meta {
      color: var(--muted);
      font-size: 0.92rem;
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .meta strong {
      color: #f8fbff;
    }

    .link-row {
      margin-bottom: 0.8rem;
      font-size: 0.92rem;
    }

    .link-row a {
      color: #7cc3ff;
      text-decoration: none;
      font-weight: 600;
    }

    .scene {
      position: relative;
      width: min(100%, 1180px);
      margin: 0 auto;
      aspect-ratio: 1536 / 1000;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .scene img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.05) contrast(1.02);
    }

    .flow {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .flow line {
      stroke: var(--line);
      stroke-width: 1.1;
      stroke-linecap: round;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.85));
      opacity: 0.98;
    }

    .panel {
      position: absolute;
      min-width: 132px;
      max-width: min(31vw, 230px);
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 7px solid #ffffff;
      border-radius: 10px;
      padding: 0.45rem 0.55rem 0.5rem;
      backdrop-filter: blur(2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      font-size: clamp(10px, 0.78vw, 14px);
    }

    .panel .title {
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.28rem;
    }

    .panel .row {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      margin-top: 0.12rem;
      white-space: nowrap;
      color: #f4f8ff;
    }

    .panel .k {
      color: #c7d4ef;
    }

    .panel.hotel { left: 10%; top: 15%; border-left-color: var(--hotel); }
    .panel.technik { left: 39%; top: 50%; border-left-color: var(--technik); }
    .panel.r1 { left: 51%; top: 56%; border-left-color: var(--r1); }
    .panel.r2 { left: 72%; top: 55%; border-left-color: var(--r2); }
    .panel.air { left: 79%; top: 79%; border-left-color: var(--air); }
    .panel.pool { left: 2%; top: 54%; border-left-color: var(--pool); min-width: 120px; }

    .pool-icon {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #7dd3fc, #0284c7);
      margin-right: 0.3rem;
      vertical-align: -1px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 860px) {
      .scene {
        aspect-ratio: 3 / 4;
      }

      .scene img {
        object-position: 58% center;
      }

      .panel {
        min-width: 118px;
        max-width: 44vw;
        padding: 0.38rem 0.45rem 0.42rem;
        font-size: clamp(10px, 2.5vw, 12px);
      }

      .panel.hotel { left: 6%; top: 9%; }
      .panel.technik { left: 35%; top: 44%; }
      .panel.r1 { left: 59%; top: 50%; }
      .panel.r2 { left: 60%; top: 63%; }
      .panel.air { left: 58%; top: 82%; }
      .panel.pool { left: 4%; top: 59%; }

      .flow line {
        stroke-width: 1.4;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="head">
      <h1>Leisenhof Live Monitoring (LH)</h1>
      <div class="meta">
        <span>Status: <strong id="connState">warte auf API...</strong></span>
        <span>Letztes Update: <strong id="lastSeen">-</strong></span>
        <span>Datensatz: <strong id="tsValue">-</strong></span>
      </div>
    </header>

    <div class="link-row">
      <a href="index.html">Zur historischen Visualisierung</a>
    </div>

    <section class="scene">
      <img src="Reactors_4.png" alt="Leisenhof Anlage" />

      <svg class="flow" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <marker id="arrowHead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="#f0f4ff" />
          </marker>
        </defs>
        <line x1="86" y1="83" x2="52" y2="52" marker-end="url(#arrowHead)"></line>
        <line x1="58" y1="58" x2="52" y2="52" marker-end="url(#arrowHead)"></line>
        <line x1="78" y1="57" x2="52" y2="52" marker-end="url(#arrowHead)"></line>
        <line x1="52" y1="52" x2="22" y2="30" marker-end="url(#arrowHead)"></line>
        <line x1="52" y1="52" x2="10" y2="60" marker-end="url(#arrowHead)"></line>
      </svg>

      <article class="panel hotel">
        <div class="title">Hotel</div>
        <div class="row"><span class="k">P_HEAT</span><span id="hotelPHeat">-</span></div>
        <div class="row"><span class="k">T_VL_HEATING</span><span id="hotelTVlHeat">-</span></div>
      </article>

      <article class="panel technik">
        <div class="title">Technikraum</div>
        <div class="row"><span class="k">P_WP_EL</span><span id="technikPWpEl">-</span></div>
        <div id="technikHeatRow" class="row"><span class="k">P_WP_HEAT</span><span id="technikPWpHeat">-</span></div>
        <div id="technikCoolRow" class="row"><span class="k">P_WP_COOL</span><span id="technikPWpCool">-</span></div>
      </article>

      <article class="panel r1">
        <div class="title">Reaktor 1</div>
        <div class="row"><span class="k">P_R1</span><span id="r1Power">-</span></div>
        <div class="row"><span class="k">T_MAX_BIO</span><span id="r1Temp">-</span></div>
      </article>

      <article class="panel r2">
        <div class="title">Reaktor 2</div>
        <div class="row"><span class="k">P_R2</span><span id="r2Power">-</span></div>
        <div class="row"><span class="k">T_MAX_BIO_R2</span><span id="r2Temp">-</span></div>
      </article>

      <article class="panel air">
        <div class="title">Luftausseneinheit</div>
        <div class="row"><span class="k">P_L</span><span id="airPower">-</span></div>
      </article>

      <article class="panel pool">
        <div class="title"><span class="pool-icon"></span>Pool</div>
        <div class="row"><span class="k">P_POOL</span><span id="poolPower">-</span></div>
        <div class="row"><span class="k">T_VL_POOL</span><span id="poolTemp">-</span></div>
      </article>
    </section>
  </main>

  <script src="live_leisenhof_reactor1.js"></script>
</body>
</html>
