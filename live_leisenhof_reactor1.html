<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leisenhof Live Monitoring</title>
  <style>
    :root {
      --ink: #e6eefc;
      --muted: #aab9d7;
      --hotel: #e0b321;
      --air: #1e3a8a;
      --pool: #3b82f6;
      --r1: #a3291b;
      --r2: #d4552f;
      --wp: #6b7280;
      --card: rgba(10, 15, 28, 0.42);
      --border: rgba(255, 255, 255, 0.2);
      --temp-border: #d62828;
      --temp-text: #ff9f1c;
      --scene-ratio: calc(1216 / 709);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      padding: 0;
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at 10% 5%, #1f2937 0%, #0b1220 55%);
    }

    .viewport {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .scene {
      position: relative;
      width: min(calc((100dvh - 24px) * var(--scene-ratio)), calc(100vw - 24px), 1216px);
      aspect-ratio: 1216 / 709;
      margin: 0 auto;
      border-radius: 0;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    .scene img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: saturate(1.05) contrast(1.02);
    }

    .flow {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .guide-path { fill: none; stroke: transparent; stroke-width: 0; }

    .p-air { stroke: var(--air); }
    .p-r1 { stroke: var(--r1); }
    .p-r2 { stroke: var(--r2); }
    .p-hotel { stroke: var(--hotel); }
    .p-pool { stroke: var(--pool); }

    .arrow-glyph {
      fill: none;
      stroke-width: 0.88;
      stroke-linecap: round;
      opacity: 0.76;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.32));
    }

    .debug-grid line {
      stroke: rgba(226, 232, 240, 0.24);
      stroke-width: 0.1;
      shape-rendering: crispEdges;
    }

    .debug-grid text {
      fill: rgba(241, 245, 249, 0.8);
      font-size: 1.05px;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .debug-point {
      stroke: rgba(15, 23, 42, 0.95);
      stroke-width: 0.2;
    }

    .debug-label {
      font-size: 1.25px;
      font-family: "Segoe UI", Arial, sans-serif;
      font-weight: 600;
      paint-order: stroke;
      stroke: rgba(10, 15, 28, 0.9);
      stroke-width: 0.25px;
    }

    .box {
      position: absolute;
      min-width: 214px;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 5px solid #ffffff;
      border-radius: 10px;
      padding: 0.56rem 0.72rem;
      backdrop-filter: blur(2px);
      box-shadow: 0 7px 16px rgba(0, 0, 0, 0.3);
      font-size: clamp(18px, 1.34vw, 24px);
      font-weight: 400;
      line-height: 1.14;
    }

    .line {
      display: flex;
      justify-content: space-between;
      gap: 0.52rem;
      white-space: nowrap;
      font-weight: 400;
    }

    .name { color: #cfddf7; margin-right: 0.34rem; font-weight: 400; }
    .val { color: #f4f8ff; font-weight: 400; }

    .pair {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.56rem;
    }

    .pair .box { position: relative; }

    .hotel-pair { left: 8.7%; top: 13.7%; }
    .r1-pair { left: 49.8%; top: 48.8%; }
    .r2-pair { left: 75.9%; top: 39.1%; }
    .pool-pair { left: 1.8%; top: 68.2%; }

    .hotel { border-left-color: var(--hotel); min-width: 196px; max-width: 224px; }
    .r1 { border-left-color: var(--r1); min-width: 230px; max-width: 260px; }
    .r2 { border-left-color: var(--r2); min-width: 230px; max-width: 260px; }
    .pool { border-left-color: var(--pool); min-width: 188px; max-width: 216px; }

    .temp {
      border: 1px solid var(--temp-border);
      border-left: 5px solid var(--temp-border);
      background: var(--card);
      min-width: 92px;
      max-width: 104px;
      padding: 0.26rem 0.44rem;
      font-size: clamp(14px, 1.0vw, 16px);
    }

    .pair .temp { margin-right: -11px; }
    .temp .line { gap: 0.14rem; }

    .temp .name,
    .temp .val {
      color: var(--temp-text);
      font-weight: 400;
    }

    .wp {
      left: 25.6%;
      top: 42.7%;
      border-left-color: var(--wp);
      min-width: 224px;
      max-width: 252px;
    }

    .wp .title {
      margin: 0 0 0.2rem;
      font-size: 1.02em;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #f4f8ff;
    }

    .air {
      left: 83.7%;
      top: 76.7%;
      border-left-color: var(--air);
      min-width: 170px;
      max-width: 198px;
    }

    .scene-title {
      position: absolute;
      left: 1.2%;
      bottom: 1.3%;
      z-index: 4;
      font-size: clamp(1.15rem, 2.1vw, 2rem);
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
    }

    .scene-top-right {
      position: absolute;
      right: 1.2%;
      top: 1.4%;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .scene-update {
      font-size: 0.78rem;
      color: #f8fbff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      white-space: nowrap;
    }

    .scene-update strong { color: #f8fbff; font-weight: 400; }

    .scene-history {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.42rem 0.7rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(95, 127, 42, 0.88);
      color: #f4f8ef;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.02rem;
      line-height: 1;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.28);
      white-space: nowrap;
      pointer-events: auto;
      z-index: 6;
    }

    .scene-copyright {
      position: absolute;
      right: 0.8rem;
      bottom: 0.6rem;
      z-index: 4;
      color: rgba(248, 251, 255, 0.86);
      font-size: 0.72rem;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
      white-space: nowrap;
    }

    @media (max-width: 980px) {
      .box {
        font-size: clamp(14px, 2.15vw, 18px);
        min-width: 150px;
      }
      .hotel, .r1, .r2, .pool, .temp, .wp, .air {
        min-width: 0;
      }
    }

    @media (max-width: 760px) {
      .viewport {
        overflow-x: auto;
        overflow-y: hidden;
        justify-content: flex-start;
      }

      .scene {
        width: calc(100dvh * 1.52);
        min-width: calc(100dvh * 1.52);
        height: 100dvh;
        aspect-ratio: auto;
        border-radius: 0;
        box-shadow: none;
      }

      .scene img { object-fit: cover; }

      .box {
        padding: 0.4rem 0.5rem;
        font-size: clamp(14px, 3.9vw, 17px);
        line-height: 1.08;
      }

      .scene-top-right {
        right: 0.5rem;
        top: 0.5rem;
        gap: 0.36rem;
      }

      .scene-update { font-size: 0.68rem; }

      .scene-history {
        font-size: 1.25rem;
        padding: 0.56rem 0.92rem;
      }

      .scene-title {
        left: 0.6rem;
        bottom: 0.55rem;
        font-size: clamp(1.42rem, 5.8vw, 1.95rem);
      }

      .scene-copyright {
        right: 0.5rem;
        bottom: 0.45rem;
        font-size: 0.62rem;
      }
    }
  </style>
</head>
<body>
  <div class="viewport">
    <section class="scene">
      <div class="scene-top-right">
        <div class="scene-update">Letztes Update: <strong id="lastSeen">-</strong></div>
        <a class="scene-history" href="/historie">Historie</a>
      </div>
      <div class="scene-title">Leisenhof Live Monitoring</div>
      <div class="scene-copyright">&copy; Biologik Systems GmbH</div>
      <img src="Reactors_4.png" alt="Leisenhof Anlage" />

      <svg class="flow" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <g class="debug-grid">
          <line x1="0" y1="0" x2="0" y2="100" /><line x1="10" y1="0" x2="10" y2="100" /><line x1="20" y1="0" x2="20" y2="100" />
          <line x1="30" y1="0" x2="30" y2="100" /><line x1="40" y1="0" x2="40" y2="100" /><line x1="50" y1="0" x2="50" y2="100" />
          <line x1="60" y1="0" x2="60" y2="100" /><line x1="70" y1="0" x2="70" y2="100" /><line x1="80" y1="0" x2="80" y2="100" />
          <line x1="90" y1="0" x2="90" y2="100" /><line x1="100" y1="0" x2="100" y2="100" />
          <line x1="0" y1="0" x2="100" y2="0" /><line x1="0" y1="10" x2="100" y2="10" /><line x1="0" y1="20" x2="100" y2="20" />
          <line x1="0" y1="30" x2="100" y2="30" /><line x1="0" y1="40" x2="100" y2="40" /><line x1="0" y1="50" x2="100" y2="50" />
          <line x1="0" y1="60" x2="100" y2="60" /><line x1="0" y1="70" x2="100" y2="70" /><line x1="0" y1="80" x2="100" y2="80" />
          <line x1="0" y1="90" x2="100" y2="90" /><line x1="0" y1="100" x2="100" y2="100" />
          <text x="0.8" y="2.1">0</text><text x="10.8" y="2.1">10</text><text x="20.8" y="2.1">20</text><text x="30.8" y="2.1">30</text>
          <text x="40.8" y="2.1">40</text><text x="50.8" y="2.1">50</text><text x="60.8" y="2.1">60</text><text x="70.8" y="2.1">70</text>
          <text x="80.8" y="2.1">80</text><text x="90.8" y="2.1">90</text>
          <text x="0.6" y="9.2">10</text><text x="0.6" y="19.2">20</text><text x="0.6" y="29.2">30</text><text x="0.6" y="39.2">40</text>
          <text x="0.6" y="49.2">50</text><text x="0.6" y="59.2">60</text><text x="0.6" y="69.2">70</text><text x="0.6" y="79.2">80</text>
          <text x="0.6" y="89.2">90</text><text x="0.6" y="99.2">100</text>
        </g>
        <defs>
          <path id="path_air_wp" class="guide-path" d="M84,52 C70,63 56,48 42,34"></path>
          <path id="path_r1_wp" class="guide-path" d="M58,30 C54,21 49,24 42,27"></path>
          <path id="path_r2_wp" class="guide-path" d="M77,27 C67,19 58,20 42,27"></path>
          <path id="path_wp_hotel" class="guide-path" d="M28,25 C24,14 22,16 20,16"></path>
          <path id="path_wp_pool" class="guide-path" d="M28,34 C26.2,39.6 23.2,46 20,46"></path>
        </defs>

        <g>
          <circle class="debug-point" cx="28" cy="25" r="0.55" fill="var(--hotel)" />
          <text class="debug-label" x="28.8" y="24.2" fill="var(--hotel)">HS(28,25)</text>
          <circle class="debug-point" cx="24" cy="14" r="0.55" fill="var(--hotel)" />
          <text class="debug-label" x="24.8" y="13.2" fill="var(--hotel)">HC1(24,14)</text>
          <circle class="debug-point" cx="22" cy="16" r="0.55" fill="var(--hotel)" />
          <text class="debug-label" x="22.8" y="15.2" fill="var(--hotel)">HC2(22,16)</text>
          <circle class="debug-point" cx="20" cy="16" r="0.55" fill="var(--hotel)" />
          <text class="debug-label" x="20.8" y="17.4" fill="var(--hotel)">HE(20,16)</text>

          <circle class="debug-point" cx="28" cy="34" r="0.55" fill="var(--pool)" />
          <text class="debug-label" x="28.8" y="33.2" fill="var(--pool)">PS(28,34)</text>
          <circle class="debug-point" cx="26.2" cy="39.6" r="0.55" fill="var(--pool)" />
          <text class="debug-label" x="27" y="38.8" fill="var(--pool)">PC1(26.2,39.6)</text>
          <circle class="debug-point" cx="23.2" cy="46" r="0.55" fill="var(--pool)" />
          <text class="debug-label" x="24" y="45.2" fill="var(--pool)">PC2(23.2,46)</text>
          <circle class="debug-point" cx="20" cy="46" r="0.55" fill="var(--pool)" />
          <text class="debug-label" x="20.8" y="47.4" fill="var(--pool)">PE(20,46)</text>
        </g>

        <g id="arrows-air"></g>
        <g id="arrows-r1"></g>
        <g id="arrows-r2"></g>
        <g id="arrows-hotel"></g>
        <g id="arrows-pool"></g>
      </svg>

      <div class="pair hotel-pair">
        <article class="box temp">
          <div class="line"><span class="name">&#127777;</span><span class="val" id="hotelTVlHeat">-</span></div>
        </article>
        <article class="box hotel">
          <div class="line"><span class="name">Hotel</span><span class="val" id="hotelPHeat">-</span></div>
        </article>
      </div>

      <article class="box wp">
        <h2 class="title">W&auml;rmepumpen</h2>
        <div class="line"><span class="name">Strom</span><span class="val" id="technikPWpEl">-</span></div>
        <div class="line"><span class="name">W&auml;rme</span><span class="val" id="technikPWpHeat">-</span></div>
      </article>

      <div class="pair r1-pair">
        <article class="box temp">
          <div class="line"><span class="name">&#127777;</span><span class="val" id="r1Temp">-</span></div>
        </article>
        <article class="box r1">
          <div class="line"><span class="name">Reaktor 1</span><span class="val" id="r1Power">-</span></div>
        </article>
      </div>

      <div class="pair r2-pair">
        <article class="box temp">
          <div class="line"><span class="name">&#127777;</span><span class="val" id="r2Temp">-</span></div>
        </article>
        <article class="box r2">
          <div class="line"><span class="name">Reaktor 2</span><span class="val" id="r2Power">-</span></div>
        </article>
      </div>

      <div class="pair pool-pair">
        <article class="box temp">
          <div class="line"><span class="name">&#127777;</span><span class="val" id="poolTemp">-</span></div>
        </article>
        <article class="box pool">
          <div class="line"><span class="name">Pool</span><span class="val" id="poolPower">-</span></div>
        </article>
      </div>

      <article class="box air">
        <div class="line"><span class="name">Luft</span><span class="val" id="airPower">-</span></div>
      </article>
    </section>
  </div>

  <script>
    (function () {
      const ns = "http://www.w3.org/2000/svg";
      const specs = [
        { path: "path_air_wp", container: "arrows-air", cls: "p-air", spacingFactor: 1, speedFactor: 1 },
        { path: "path_r1_wp", container: "arrows-r1", cls: "p-r1", spacingFactor: 1, speedFactor: 1 },
        { path: "path_r2_wp", container: "arrows-r2", cls: "p-r2", spacingFactor: 1, speedFactor: 1 },
        { path: "path_wp_hotel", container: "arrows-hotel", cls: "p-hotel", spacingFactor: 1.45, speedFactor: 1.45 },
        { path: "path_wp_pool", container: "arrows-pool", cls: "p-pool", spacingFactor: 1.45, speedFactor: 1.45 },
      ];

      const refPath = document.getElementById("path_air_wp");
      if (!refPath) return;

      const refDur = 10.8;
      const refLen = refPath.getTotalLength() || 1;
      const refCount = 8;
      const spacingDist = refLen / refCount;

      for (const spec of specs) {
        const path = document.getElementById(spec.path);
        const container = document.getElementById(spec.container);
        if (!path || !container) continue;

        const len = path.getTotalLength() || 1;
        const count = Math.max(3, Math.round(len / (spacingDist * spec.spacingFactor)));
        const dur = refDur * (len / refLen) * spec.speedFactor;
        const step = dur / count;

        for (let i = 0; i < count; i += 1) {
          const g = document.createElementNS(ns, "g");
          g.setAttribute("class", `arrow-glyph ${spec.cls}`);

          const p1 = document.createElementNS(ns, "path");
          p1.setAttribute("d", "M0,0 L-1.8,-1.1");
          const p2 = document.createElementNS(ns, "path");
          p2.setAttribute("d", "M0,0 L-1.8,1.1");

          const motion = document.createElementNS(ns, "animateMotion");
          motion.setAttribute("dur", `${dur.toFixed(3)}s`);
          motion.setAttribute("begin", `${(-i * step).toFixed(3)}s`);
          motion.setAttribute("repeatCount", "indefinite");
          motion.setAttribute("rotate", "auto");

          const mpath = document.createElementNS(ns, "mpath");
          mpath.setAttribute("href", `#${spec.path}`);
          motion.appendChild(mpath);

          g.appendChild(p1);
          g.appendChild(p2);
          g.appendChild(motion);
          container.appendChild(g);
        }
      }
    })();
  </script>
  <script src="live_leisenhof_reactor1.js"></script>
</body>
</html>
