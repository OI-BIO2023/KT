<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leisenhof Live Monitoring</title>
  <style>
    :root {
      --ink: #e6eefc;
      --muted: #aab9d7;
      --hotel: #d4af37;
      --air: #1e3a8a;
      --pool: #3b82f6;
      --r1: #7a2f1b;
      --r2: #7a2f1b;
      --wp: #1fbf3d;
      --card: rgba(10, 15, 28, 0.42);
      --border: rgba(255, 255, 255, 0.2);
      --temp-border: #d62828;
      --temp-text: #ff9f1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0.9rem;
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at 10% 5%, #1f2937 0%, #0b1220 55%);
    }

    .shell {
      max-width: 1280px;
      margin: 0 auto;
    }

    .head {
      margin-bottom: 0.72rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.36rem, 2.5vw, 2rem);
      line-height: 1.55;
      letter-spacing: 0.02em;
      min-height: 3.1rem;
    }

    .head-right {
      min-height: 3.1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      gap: 0.25rem;
    }

    .meta {
      color: var(--muted);
      font-size: 0.78rem;
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      justify-content: flex-end;
      text-align: right;
      line-height: 1.2;
    }

    .meta strong { color: #f8fbff; font-weight: 400; }

    .link-row { font-size: 0.9rem; text-align: right; width: 100%; }

    .link-row a {
      color: #7cc3ff;
      text-decoration: none;
      font-weight: 400;
    }

    .scene {
      position: relative;
      width: min(100%, 1220px);
      margin: 0 auto;
      aspect-ratio: 1536 / 1000;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .scene img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.05) contrast(1.02);
    }

    .flow {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .guide-path { fill: none; stroke: transparent; stroke-width: 0; }

    .p-air { stroke: var(--air); }
    .p-r1 { stroke: var(--r1); }
    .p-r2 { stroke: var(--r2); }
    .p-hotel { stroke: var(--hotel); }
    .p-pool { stroke: var(--pool); }

    .arrow-glyph {
      fill: none;
      stroke-width: 0.88;
      stroke-linecap: round;
      opacity: 0.76;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.32));
    }

    .box {
      position: absolute;
      min-width: 214px;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 5px solid #ffffff;
      border-radius: 10px;
      padding: 0.56rem 0.72rem;
      backdrop-filter: blur(2px);
      box-shadow: 0 7px 16px rgba(0, 0, 0, 0.3);
      font-size: clamp(18px, 1.34vw, 24px);
      font-weight: 400;
      line-height: 1.14;
    }

    .line {
      display: flex;
      justify-content: space-between;
      gap: 0.52rem;
      white-space: nowrap;
      font-weight: 400;
    }

    .name { color: #cfddf7; margin-right: 0.34rem; font-weight: 400; }
    .val { color: #f4f8ff; font-weight: 400; }

    .pair {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.56rem;
    }

    .pair .box { position: relative; }

    .hotel-pair { left: 8.7%; top: 13.7%; }
    .r1-pair { left: 49.8%; top: 48.8%; }
    .r2-pair { left: 75.9%; top: 39.1%; }
    .pool-pair { left: 1.8%; top: 55.2%; }

    .hotel { border-left-color: var(--hotel); min-width: 196px; max-width: 224px; }
    .r1 { border-left-color: var(--r1); min-width: 230px; max-width: 260px; }
    .r2 { border-left-color: var(--r2); min-width: 230px; max-width: 260px; }
    .pool { border-left-color: var(--pool); min-width: 188px; max-width: 216px; }

    .temp {
      border: 1px solid var(--temp-border);
      border-left: 5px solid var(--temp-border);
      background: var(--card);
      min-width: 92px;
      max-width: 104px;
      padding: 0.26rem 0.44rem;
      font-size: clamp(14px, 1.0vw, 16px);
    }

    .pair .temp { margin-right: -11px; }
    .pool-pair { transform: translateY(11px); }
    .temp .line { gap: 0.14rem; }

    .temp .name,
    .temp .val {
      color: var(--temp-text);
      font-weight: 400;
    }

    .wp {
      left: 25.6%;
      top: 42.7%;
      border-left-color: var(--wp);
      min-width: 224px;
      max-width: 252px;
    }

    .wp .title {
      margin: 0 0 0.2rem;
      font-size: 1.02em;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #f4f8ff;
    }

    .air {
      left: 83.7%;
      top: 76.7%;
      border-left-color: var(--air);
      min-width: 170px;
      max-width: 198px;
    }

    @media (max-width: 980px) {
      body { padding: 0.6rem; }
      h1 {
        min-height: auto;
        line-height: 1.25;
      }
      .head-right {
        min-height: auto;
        width: 100%;
        align-items: flex-start;
      }
      .meta, .link-row {
        justify-content: flex-start;
        text-align: left;
      }
      .box {
        font-size: clamp(14px, 2.15vw, 18px);
        min-width: 150px;
      }
      .hotel, .r1, .r2, .pool, .temp, .wp, .air {
        min-width: 0;
      }
    }

    @media (max-width: 760px) {
      .scene { border-radius: 10px; }

      .box {
        padding: 0.34rem 0.44rem;
        font-size: clamp(13px, 3.4vw, 16px);
        line-height: 1.08;
      }

      .hotel { min-width: 122px; max-width: 142px; }
      .pool { min-width: 122px; max-width: 142px; }
      .r1 { min-width: 134px; max-width: 152px; }
      .r2 { min-width: 134px; max-width: 152px; }
      .wp { min-width: 152px; max-width: 170px; }
      .air { min-width: 114px; max-width: 128px; }
      .temp { min-width: 66px; max-width: 74px; padding: 0.18rem 0.3rem; }
      .pair .temp { margin-right: -6px; }
      .temp .line { gap: 0.08rem; }

      .hotel-pair { left: 1.8%; top: 6.2%; }
      .r1-pair { left: 46.8%; top: 36.5%; }
      .r2-pair { left: 69.8%; top: 30.2%; }
      .pool-pair { left: 1.2%; top: 70.2%; transform: none; }
      .wp { left: 30.5%; top: 57.2%; }
      .air { left: 76.2%; top: 85.4%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="head">
      <h1>Leisenhof Live Monitoring</h1>
      <div class="head-right">
        <div class="meta">
          <span>Status: <strong id="connState">warte auf API...</strong></span>
          <span>Letztes Update: <strong id="lastSeen">-</strong></span>
        </div>
        <div class="link-row"><a href="index.html">Historie</a></div>
      </div>
    </header>

    <section class="scene">
      <img src="Reactors_4.png" alt="Leisenhof Anlage" />

      <svg class="flow" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <path id="path_air_wp" class="guide-path" d="M84,52 C70,63 56,50 42,37"></path>
          <path id="path_r1_wp" class="guide-path" d="M58,35 C54,26 49,24 42,27"></path>
          <path id="path_r2_wp" class="guide-path" d="M77,27 C67,19 58,20 42,27"></path>
          <path id="path_wp_hotel" class="guide-path" d="M28,27 C23,18 21,17 20,16"></path>
          <path id="path_wp_pool" class="guide-path" d="M28,37 C26,42 23,45 20,44"></path>
        </defs>

        <g id="arrows-air"></g>
        <g id="arrows-r1"></g>
        <g id="arrows-r2"></g>
        <g id="arrows-hotel"></g>
        <g id="arrows-pool"></g>
      </svg>

      <div class="pair hotel-pair">
        <article class="box temp">
          <div class="line"><span class="name">&#127777;</span><span class="val" id="hotelTVlHeat">-</span></div>
        </article>
        <article class="box hotel">
          <div class="line"><span class="name">Hotel</span><span class="val" id="hotelPHeat">-</span></div>
        </article>
      </div>

      <article class="box wp">
        <h2 class="title">W&auml;rmepumpen</h2>
        <div class="line"><span class="name">Strom</span><span class="val" id="technikPWpEl">-</span></div>
        <div class="line"><span class="name">W&auml;rme</span><span class="val" id="technikPWpHeat">-</span></div>
      </article>

      <div class="pair r1-pair">
        <article class="box temp">
          <div class="line"><span class="name">&#127777;</span><span class="val" id="r1Temp">-</span></div>
        </article>
        <article class="box r1">
          <div class="line"><span class="name">Reaktor 1</span><span class="val" id="r1Power">-</span></div>
        </article>
      </div>

      <div class="pair r2-pair">
        <article class="box temp">
          <div class="line"><span class="name">&#127777;</span><span class="val" id="r2Temp">-</span></div>
        </article>
        <article class="box r2">
          <div class="line"><span class="name">Reaktor 2</span><span class="val" id="r2Power">-</span></div>
        </article>
      </div>

      <div class="pair pool-pair">
        <article class="box temp">
          <div class="line"><span class="name">&#127777;</span><span class="val" id="poolTemp">-</span></div>
        </article>
        <article class="box pool">
          <div class="line"><span class="name">Pool</span><span class="val" id="poolPower">-</span></div>
        </article>
      </div>

      <article class="box air">
        <div class="line"><span class="name">Luft</span><span class="val" id="airPower">-</span></div>
      </article>
    </section>
  </main>

  <script>
    (function () {
      const ns = "http://www.w3.org/2000/svg";
      const specs = [
        { path: "path_air_wp", container: "arrows-air", cls: "p-air" },
        { path: "path_r1_wp", container: "arrows-r1", cls: "p-r1" },
        { path: "path_r2_wp", container: "arrows-r2", cls: "p-r2" },
        { path: "path_wp_hotel", container: "arrows-hotel", cls: "p-hotel" },
        { path: "path_wp_pool", container: "arrows-pool", cls: "p-pool" },
      ];

      const refPath = document.getElementById("path_air_wp");
      if (!refPath) return;

      const refDur = 10.8;
      const refLen = refPath.getTotalLength() || 1;
      const refCount = 8;
      const spacingDist = refLen / refCount;

      for (const spec of specs) {
        const path = document.getElementById(spec.path);
        const container = document.getElementById(spec.container);
        if (!path || !container) continue;

        const len = path.getTotalLength() || 1;
        const count = Math.max(4, Math.round(len / spacingDist));
        const dur = refDur * (len / refLen);
        const step = dur / count;

        for (let i = 0; i < count; i += 1) {
          const g = document.createElementNS(ns, "g");
          g.setAttribute("class", `arrow-glyph ${spec.cls}`);

          const p1 = document.createElementNS(ns, "path");
          p1.setAttribute("d", "M0,0 L-1.8,-1.1");
          const p2 = document.createElementNS(ns, "path");
          p2.setAttribute("d", "M0,0 L-1.8,1.1");

          const motion = document.createElementNS(ns, "animateMotion");
          motion.setAttribute("dur", `${dur.toFixed(3)}s`);
          motion.setAttribute("begin", `${(-i * step).toFixed(3)}s`);
          motion.setAttribute("repeatCount", "indefinite");
          motion.setAttribute("rotate", "auto");

          const mpath = document.createElementNS(ns, "mpath");
          mpath.setAttribute("href", `#${spec.path}`);
          motion.appendChild(mpath);

          g.appendChild(p1);
          g.appendChild(p2);
          g.appendChild(motion);
          container.appendChild(g);
        }
      }
    })();
  </script>
  <script src="live_leisenhof_reactor1.js"></script>
</body>
</html>
