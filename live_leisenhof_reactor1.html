<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leisenhof Live Monitoring</title>
  <style>
    :root {
      --ink: #e6eefc;
      --muted: #aab9d7;
      --hotel: #d4af37;
      --air: #1e3a8a;
      --pool: #3b82f6;
      --r1: #6b7f2a;
      --r2: #6b7f2a;
      --wp: #7f1d1d;
      --card: rgba(10, 15, 28, 0.42);
      --border: rgba(255, 255, 255, 0.2);
      --temp-border: #d62828;
      --temp-text: #ff9f1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0.9rem;
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at 10% 5%, #1f2937 0%, #0b1220 55%);
    }

    .shell {
      max-width: 1280px;
      margin: 0 auto;
    }

    .head {
      margin-bottom: 0.72rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.36rem, 2.5vw, 2rem);
      line-height: 1.55;
      letter-spacing: 0.02em;
      min-height: 3.1rem;
    }

    .head-right {
      min-height: 3.1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      gap: 0.25rem;
    }

    .meta {
      color: var(--muted);
      font-size: 0.78rem;
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      justify-content: flex-end;
      text-align: right;
      line-height: 1.2;
    }

    .meta strong { color: #f8fbff; font-weight: 400; }

    .link-row { font-size: 0.9rem; text-align: right; width: 100%; }

    .link-row a {
      color: #7cc3ff;
      text-decoration: none;
      font-weight: 400;
    }

    .scene {
      position: relative;
      width: min(100%, 1220px);
      margin: 0 auto;
      aspect-ratio: 1536 / 1000;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .scene img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.05) contrast(1.02);
    }

    .flow {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .guide-path { fill: none; stroke: transparent; stroke-width: 0; }

    .grid-line {
      stroke: #d1d5db;
      stroke-width: 0.08;
      opacity: 0.42;
    }

    .grid-label {
      fill: #e5e7eb;
      font-size: 0.95px;
      font-family: "Segoe UI", Arial, sans-serif;
      opacity: 0.65;
    }

    .debug-path {
      fill: none;
      stroke-width: 0.26;
      opacity: 0.66;
      stroke-dasharray: 0.8 0.62;
    }

    .p-air { stroke: var(--air); }
    .p-r1 { stroke: var(--r1); }
    .p-r2 { stroke: var(--r2); }
    .p-hotel { stroke: var(--hotel); }
    .p-pool { stroke: var(--pool); }

    .debug-point {
      r: 0.38;
      fill: #f8fafc;
      stroke: #0f172a;
      stroke-width: 0.1;
      opacity: 0.95;
    }

    .debug-label {
      font-size: 1px;
      font-family: "Segoe UI", Arial, sans-serif;
      paint-order: stroke;
      stroke: rgba(0, 0, 0, 0.75);
      stroke-width: 0.2;
      opacity: 0.95;
    }

    .debug-label.p-air { fill: var(--air); }
    .debug-label.p-r1 { fill: var(--r1); }
    .debug-label.p-r2 { fill: var(--r2); }
    .debug-label.p-hotel { fill: var(--hotel); }
    .debug-label.p-pool { fill: var(--pool); }

    .arrow-glyph {
      fill: none;
      stroke-width: 0.88;
      stroke-linecap: round;
      opacity: 0.76;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.32));
    }

    .box {
      position: absolute;
      min-width: 214px;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 5px solid #ffffff;
      border-radius: 10px;
      padding: 0.56rem 0.72rem;
      backdrop-filter: blur(2px);
      box-shadow: 0 7px 16px rgba(0, 0, 0, 0.3);
      font-size: clamp(18px, 1.34vw, 24px);
      font-weight: 400;
      line-height: 1.14;
    }

    .line {
      display: flex;
      justify-content: space-between;
      gap: 0.52rem;
      white-space: nowrap;
      font-weight: 400;
    }

    .name { color: #cfddf7; margin-right: 0.34rem; font-weight: 400; }
    .val { color: #f4f8ff; font-weight: 400; }

    .pair {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.56rem;
    }

    .pair .box { position: relative; }

    .hotel-pair { left: 8.7%; top: 13.7%; }
    .r1-pair { left: 49.8%; top: 48.8%; }
    .r2-pair { left: 70.9%; top: 41.1%; }
    .pool-pair { left: 1.8%; top: 55.2%; }

    .hotel { border-left-color: var(--hotel); min-width: 222px; max-width: 252px; }
    .r1 { border-left-color: var(--r1); min-width: 230px; max-width: 260px; }
    .r2 { border-left-color: var(--r2); min-width: 230px; max-width: 260px; }
    .pool { border-left-color: var(--pool); min-width: 214px; max-width: 246px; }

    .temp {
      border: 1px solid var(--temp-border);
      border-left: 5px solid var(--temp-border);
      background: var(--card);
      min-width: 122px;
      max-width: 136px;
      padding: 0.26rem 0.44rem;
    }

    .pair .temp { margin-right: -11px; }
    .pool-pair { transform: translateY(8px); }
    .temp .line { gap: 0.2rem; }

    .temp .name,
    .temp .val {
      color: var(--temp-text);
      font-weight: 400;
    }

    .wp {
      left: 25.6%;
      top: 42.7%;
      border-left-color: var(--wp);
      min-width: 248px;
      max-width: 280px;
    }

    .wp .title {
      margin: 0 0 0.2rem;
      font-size: 1.02em;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #f4f8ff;
    }

    .air {
      left: 83.7%;
      top: 76.7%;
      border-left-color: var(--air);
      min-width: 170px;
      max-width: 198px;
    }

    @media (max-width: 980px) {
      body { padding: 0.6rem; }
      h1 {
        min-height: auto;
        line-height: 1.25;
      }
      .head-right {
        min-height: auto;
        width: 100%;
        align-items: flex-start;
      }
      .meta, .link-row {
        justify-content: flex-start;
        text-align: left;
      }
      .box {
        font-size: clamp(14px, 2.15vw, 18px);
        min-width: 150px;
      }
      .hotel, .r1, .r2, .pool, .temp, .wp, .air {
        min-width: 0;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="head">
      <h1>Leisenhof Live Monitoring</h1>
      <div class="head-right">
        <div class="meta">
          <span>Status: <strong id="connState">warte auf API...</strong></span>
          <span>Letztes Update: <strong id="lastSeen">-</strong></span>
        </div>
        <div class="link-row"><a href="index.html">Zur historischen Visualisierung</a></div>

          <line class="grid-line" x1="100" y1="0" x2="100" y2="100"></line><text class="grid-label" x="96.8" y="2.2">100</text>

          <line class="grid-line" x1="0" y1="0" x2="100" y2="0"></line><text class="grid-label" x="0.7" y="1.6">0</text>
          <line class="grid-line" x1="0" y1="10" x2="100" y2="10"></line><text class="grid-label" x="0.7" y="11.6">10</text>
          <line class="grid-line" x1="0" y1="20" x2="100" y2="20"></line><text class="grid-label" x="0.7" y="21.6">20</text>
          <line class="grid-line" x1="0" y1="30" x2="100" y2="30"></line><text class="grid-label" x="0.7" y="31.6">30</text>
          <line class="grid-line" x1="0" y1="40" x2="100" y2="40"></line><text class="grid-label" x="0.7" y="41.6">40</text>
          <line class="grid-line" x1="0" y1="50" x2="100" y2="50"></line><text class="grid-label" x="0.7" y="51.6">50</text>
          <line class="grid-line" x1="0" y1="60" x2="100" y2="60"></line><text class="grid-label" x="0.7" y="61.6">60</text>
          <line class="grid-line" x1="0" y1="70" x2="100" y2="70"></line><text class="grid-label" x="0.7" y="71.6">70</text>
          <line class="grid-line" x1="0" y1="80" x2="100" y2="80"></line><text class="grid-label" x="0.7" y="81.6">80</text>

        <circle class="debug-point" cx="49" cy="33"></circle><text class="debug-label p-r1" x="49.6" y="32.1">R1 C1(49,33)</text>
        <circle class="debug-point" cx="47" cy="30"></circle><text class="debug-label p-r1" x="47.6" y="29.1">R1 C2(47,30)</text>
        <circle class="debug-point" cx="46" cy="27"></circle><text class="debug-label p-r1" x="46.6" y="28.3">R1 E(46,27)</text>

        <g id="arrows-r1"></g>

      <div class="pair hotel-pair">
        <article class="box temp">
          <div class="line"><span class="name">&#127777;</span><span class="val" id="hotelTVlHeat">-</span></div>
        </article>
        <article class="box hotel">
          <div class="line"><span class="name">Hotel</span><span class="val" id="hotelPHeat">-</span></div>
        </article>
      </div>

      <article class="box wp">
        <h2 class="title">W&auml;rmepumpen</h2>
        <div class="line"><span class="name">Strom</span><span class="val" id="technikPWpEl">-</span></div>
        <div class="line"><span class="name">W&auml;rme</span><span class="val" id="technikPWpHeat">-</span></div>
      </article>

      <div class="pair r1-pair">
        <article class="box temp">
          <div class="line"><span class="name">&#127777;</span><span class="val" id="r1Temp">-</span></div>

  </main>

  <script>
    (function () {
      const ns = "http://www.w3.org/2000/svg";
      const specs = [
        { path: "path_air_wp", container: "arrows-air", cls: "p-air" },
        { path: "path_r1_wp", container: "arrows-r1", cls: "p-r1" },
        { path: "path_r2_wp", container: "arrows-r2", cls: "p-r2" },
        { path: "path_wp_hotel", container: "arrows-hotel", cls: "p-hotel" },
        { path: "path_wp_pool", container: "arrows-pool", cls: "p-pool" },
      ];

      const refPath = document.getElementById("path_air_wp");
      if (!refPath) return;

      const refDur = 7.0;
      const refLen = refPath.getTotalLength() || 1;
      const refCount = 10;
      const spacingDist = refLen / refCount;

      for (const spec of specs) {
        const path = document.getElementById(spec.path);
        const container = document.getElementById(spec.container);
        if (!path || !container) continue;

        const len = path.getTotalLength() || 1;
        const count = Math.max(4, Math.round(len / spacingDist));
        const dur = refDur * (len / refLen);
        const step = dur / count;

        for (let i = 0; i < count; i += 1) {
          const g = document.createElementNS(ns, "g");
          g.setAttribute("class", `arrow-glyph ${spec.cls}`);

          const p1 = document.createElementNS(ns, "path");
          p1.setAttribute("d", "M0,0 L-1.8,-1.1");
          const p2 = document.createElementNS(ns, "path");
          p2.setAttribute("d", "M0,0 L-1.8,1.1");

          const motion = document.createElementNS(ns, "animateMotion");
          motion.setAttribute("dur", `${dur.toFixed(3)}s`);
          motion.setAttribute("begin", `${(-i * step).toFixed(3)}s`);
          motion.setAttribute("repeatCount", "indefinite");
          motion.setAttribute("rotate", "auto");

          const mpath = document.createElementNS(ns, "mpath");
          mpath.setAttribute("href", `#${spec.path}`);
          motion.appendChild(mpath);

          g.appendChild(p1);
          g.appendChild(p2);
          g.appendChild(motion);
          container.appendChild(g);
        }
      }
    })();
  </script>
  <script src="live_leisenhof_reactor1.js"></script>
</body>
</html>
